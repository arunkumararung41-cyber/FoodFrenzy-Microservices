spring.application.name=foodfrenzy-api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Auth Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://FOODFRENZY-AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Food Service
spring.cloud.gateway.server.webflux.routes[1].id=food-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://FOODFRENZY-FOOD-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/foods/**

# Cart Service
spring.cloud.gateway.server.webflux.routes[2].id=cart-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://FOODFRENZY-CART-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/carts/**

# Order Service
spring.cloud.gateway.server.webflux.routes[3].id=order-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://FOODFRENZY-ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/orders/**

# Payment Service
spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://FOODFRENZY-PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payments/**

# Notification Service
spring.cloud.gateway.server.webflux.routes[5].id=notification-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://FOODFRENZY-NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/notifications/**